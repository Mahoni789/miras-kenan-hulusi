<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- ============================================
         ARKA PLAN
         ============================================ -->
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%"   stop-color="#0a1230"/>
      <stop offset="60%"  stop-color="#060a1f"/>
      <stop offset="100%" stop-color="#03040d"/>
    </radialGradient>

    <!-- ============================================
         IŞIK LEKELERİ
         ============================================ -->
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7a3ecf" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#5a2aa0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5a2aa0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2a6bd8" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#1a4aa0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a4aa0" stop-opacity="0"/>
    </radialGradient>

    <!-- ============================================
         DALGA GRADYANLARI
         ============================================ -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a8b8e8" stop-opacity="0"/>
      <stop offset="10%"  stop-color="#a8b8e8" stop-opacity="0.85"/>
      <stop offset="90%"  stop-color="#a8b8e8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a8b8e8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#5a86c8" stop-opacity="0"/>
      <stop offset="10%"  stop-color="#5a86c8" stop-opacity="0.6"/>
      <stop offset="90%"  stop-color="#5a86c8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5a86c8" stop-opacity="0"/>
    </linearGradient>

    <!-- ============================================
         FİLTRELER
         ============================================ -->
    <filter id="blobBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>

    <filter id="waveBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>

    <style>
      /* ============================================
         ANİMASYONLAR — farklı hız + faz
         ============================================ */
      .wave {
        transform-box: fill-box;
        transform-origin: center;
        will-change: transform;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }

      /* Dalga 1: hızlı, yukarı */
      .wave-1 {
        animation-name: floatUp;
        animation-duration: 7s;
      }

      /* Dalga 2: yavaş, aşağı (ters faz) */
      .wave-2 {
        animation-name: floatDown;
        animation-duration: 12s;
        animation-delay: -3s;
      }

      @keyframes floatUp {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-24px); }
      }

      @keyframes floatDown {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(20px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .wave { animation: none; }
      }
    </style>
  </defs>

  <!-- ARKA PLAN -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- IŞIK LEKELERİ -->
  <g filter="url(#blobBlur)">
    <ellipse cx="250"  cy="200" rx="360" ry="320" fill="url(#blob1)"/>
    <ellipse cx="1300" cy="720" rx="420" ry="340" fill="url(#blob2)"/>
  </g>

  <!-- ============================================
       DALGALAR — sol kenardan sağa, belirgin salınımlı
       ============================================ -->
  <g fill="none" stroke-width="1.6" stroke-linecap="round" filter="url(#waveBlur)">

    <!-- DALGA 1 (üst) — 4 tepe + 4 çukur -->
    <path class="wave wave-1" stroke="url(#waveGrad1)"
          d="M -50 500
             C 150 380, 250 380, 400 500
             C 550 620, 650 620, 800 500
             C 950 380, 1050 380, 1200 500
             C 1350 620, 1450 620, 1650 500"/>

    <!-- DALGA 2 (alt) — zıt faz (1'in tersi) -->
    <path class="wave wave-2" stroke="url(#waveGrad2)"
          d="M -50 680
             C 150 800, 250 800, 400 680
             C 550 560, 650 560, 800 680
             C 950 800, 1050 800, 1200 680
             C 1350 560, 1450 560, 1650 680"/>

  </g>
</svg>