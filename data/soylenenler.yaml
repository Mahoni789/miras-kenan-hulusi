- name: "Tahir Alangu"
  title: "*Cumhuriyetten Sonra Hikâye ve Roman*"
  desc: "Kendini arayan, geç kalmış bir sanatçı telaşı ile çok acele yazılmış, taslak hâlinde eserler de bırakmış olmasına rağmen, bunlardaki çeşitlilik, günümüz hikâyeciliğinin çeşitliliğine işaret edercesine geniştir"
- name: "Behçet Necatigil"
  title: "*Edebiyatımızda Eserler Sözlüğü*"
  desc: "Hayalle gerçeği yoğun bir şiir gücüyle kaynaştırmış ve böylece modern hikâyeciliğimizin temel taşlarını koymuştu"
- name: "Cevdet Kudret"
  title: "Bir Ölünün Arkasından Düşünceler"
  desc: "Kenan Hulûsi, her şeyden önce şekil ve kelimelerde kıymet gören bir sanatkâr titizliğiyle yazıcılık hayatına başladı. Anlatılan şeyin değil, anlatış tarzının güzel ve mutlaka ahenkli olmasını isterdi"